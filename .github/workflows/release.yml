name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    release:
        if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
        uses: koslibs/configs/.github/workflows/npm-release.yml@v0.2.12
        secrets:
            npm_token: ${{ secrets.NPM_TOKEN }}
